name: 🎮 Gaming POD Agent — Semanal

on:
  schedule:
    - cron: '0 8 * * 1'  # Cada lunes a las 8am UTC
  workflow_dispatch:      # También se puede correr manualmente

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Gaming POD Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IDEOGRAM_API_KEY:  ${{ secrets.IDEOGRAM_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
        run: python scripts/weekly_agent.py
