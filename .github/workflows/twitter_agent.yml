name: 🐦 Twitter/X Agent — 3x diario

on:
  schedule:
    - cron: '0 9  * * *'   # 9am UTC  — curiosidad
    - cron: '0 15 * * *'   # 3pm UTC  — hilo
    - cron: '0 21 * * *'   # 9pm UTC  — pregunta
  workflow_dispatch:

jobs:
  twitter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests requests-oauthlib

      - name: Run Twitter/X Agent
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }} }}
          GITHUB_TOKEN:                ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:                 ${{ github.repository }}
          TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:          ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          AMAZON_AFFILIATE_TAG:        ${{ secrets.AMAZON_AFFILIATE_TAG }}
        run: python agents/twitter/daily_agent.py
